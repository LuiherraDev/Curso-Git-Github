# ╔══════════════════════════════════════════════════════╗
# ║          BRAINIAC RECIBE LOS NUEVOS INFORMES         ║
# ║                                                      ║
# ║  Cada vez que alguien abre un issue, Brainiac        ║
# ║  responde automáticamente confirmando que el         ║
# ║  informe ya está siendo analizado.                   ║
# ╚══════════════════════════════════════════════════════╝

name: 🤖 Bienvenida de Brainiac

on:
  #issues:
  #  types: [opened]
  workflow_dispatch:
permissions:
  issues: write

jobs:
  dar-bienvenida:
    runs-on: ubuntu-latest

    steps:
      - name: Brainiac registra el informe
        run: |
          echo "📡 Nuevo informe recibido en la Fortaleza"
          echo "Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          echo "Enviado por: @${{ github.event.issue.user.login }}"

      - name: Brainiac responde al informante
        uses: actions/github-script@v7
        with:
          script: |
            const autor = context.payload.issue.user.login;

            const mensaje = [
              '## 🤖 Transmisión automática de Brainiac',
              '',
              `Saludos, @${autor}. Tu informe ha sido recibido por la Legión.`,
              '',
              '> 🔎 **Estado:** tu issue está siendo revisado por Brainiac.',
              '',
              'Mi procesador de nivel 12 ya está analizando el contenido.',
              'Un miembro del Consejo te responderá en cuanto el análisis termine.',
              '',
              '---',
              '*Mensaje generado automáticamente por la Fortaleza Prohibida.*'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: mensaje
            });

      - name: Confirmar transmisión
        run: echo "✅ Brainiac ha respondido al issue `#${{ github.event.issue.number }}`"
